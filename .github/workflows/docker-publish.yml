name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout cluster-config main
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: downfa11/cluster-config
          ref: main
          token: ${{ secrets.CLUSTER_CONFIG_TOKEN }}
          path: cluster-config
          fetch-depth: 0

      - name: Update immutable image reference
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python cluster-config/scripts/update_image_digests.py \
            --repo-root cluster-config \
            --image "cluster-sentinel=$IMAGE_DIGEST"

      - name: Commit desired state directly to main
        if: github.ref == 'refs/heads/main'
        shell: bash
        working-directory: cluster-config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          is_current_source() {
            local latest_source_sha
            latest_source_sha="$(
              curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$SOURCE_REPOSITORY/commits/main" \
                | python -c 'import json, sys; print(json.load(sys.stdin)["sha"])'
            )"
            [ "$latest_source_sha" = "$SOURCE_SHA" ]
          }

          if ! is_current_source; then
            echo "skipping stale source commit $SOURCE_SHA; main has advanced"
            exit 0
          fi

          git config user.name "home-gitops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clusters/home/apps/cluster-sentinel.yaml
          if git diff --cached --quiet; then
            echo "cluster-config already references this digest"
            exit 0
          fi
          git commit --signoff -m "deploy: update sentinel image to ${SOURCE_SHA::7}"
          for attempt in 1 2 3; do
            if ! is_current_source; then
              echo "skipping stale source commit $SOURCE_SHA; main has advanced"
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "failed to update cluster-config/main after 3 attempts" >&2
          exit 1
