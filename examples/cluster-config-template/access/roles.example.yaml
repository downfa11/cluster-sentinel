roles:
  dev:
    commands: [status, logs, deploy, whois, members]
    environments: [dev, staging]
    production: false
  operator:
    commands: [status, logs, deploy, restart, rollback, whois, members]
    environments: [dev, staging, production]
    production_requires_approval: true
  admin:
    commands: ["*"]
    environments: ["*"]
