display_information:
  name: Sentinel
features:
  bot_user:
    display_name: Sentinel
    always_online: true
  slash_commands:
    - command: /sentinel
      description: AI GitOps DevOps Agent
      usage_hint: status api prod
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - reactions:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: true
