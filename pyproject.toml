[project]
name = "cluster-sentinel"
version = "0.1.0"
description = "AI-powered GitOps DevOps Agent"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.0.0",
  "slack-bolt>=1.18.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "PyGithub>=2.0.0",
  "httpx>=0.27.0",
  "hjson>=3.1.0,<4.0.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
sentinel = "sentinel.app:main"
sentinel-access-sync = "sentinel.access.sync:main"
sentinel-slack-notify = "sentinel.slack.notify:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
[[tool.mypy.overrides]]
module = ["yaml", "hjson"]
ignore_missing_imports = true
